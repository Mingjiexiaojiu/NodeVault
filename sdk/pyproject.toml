[project]
name = "nodevault-sdk"
version = "2.0.0"
description = "NodeVault Python SDK - Enterprise AI Capability Registry client"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nodevault_sdk*"]
